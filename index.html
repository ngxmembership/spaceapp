<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e17; color: white; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin: 0; color: #f2c94c; }
        .section-title {
            width: 100%; color: #f2c94c; font-size: 12px; font-weight: bold; 
            letter-spacing: 1px; margin: 15px 0 8px 5px; text-transform: uppercase;
        }
        .card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(242, 201, 76, 0.15);
            border-radius: 14px; padding: 15px; width: 100%; margin-bottom: 10px; box-sizing: border-box;
        }
        .input-field {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 12px; color: white; font-size: 16px; margin-bottom: 12px;
            box-sizing: border-box; outline: none;
        }
        .input-field:focus { border-color: #f2c94c; }
        .row { display: flex; gap: 10px; width: 100%; }
        .row .input-field { flex: 1; }
        .main-btn {
            background: #f2c94c; color: #0a0e17; padding: 16px; border-radius: 12px;
            width: 100%; border: none; font-size: 16px; font-weight: bold; margin-top: 15px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(242, 201, 76, 0.2);
        }
        .result-box {
            display: none; background: rgba(242, 201, 76, 0.05); 
            border: 1px dashed #f2c94c; border-radius: 14px; padding: 15px; 
            width: 100%; margin-top: 20px; box-sizing: border-box;
        }
        .result-box h2 { color: #f2c94c; font-size: 18px; margin-top: 0; }
        .result-item { margin-bottom: 10px; font-size: 15px; line-height: 1.4; }
        .number-badge { background: #f2c94c; color: #0a0e17; padding: 2px 8px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Space Panel 2.0</h1>
        <p style="color: #888; margin: 5px 0 0 0; font-size: 14px;">Мгновенный расчет внутри экрана</p>
    </div>

    <div class="section-title">Выбор периода</div>
    <div class="btn-group" style="display: flex; gap: 10px; width: 100%; margin-bottom: 10px;">
        <button class="btn" style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: #1a1f2e; color: white; font-weight: 600;" id="btn-today" onclick="setDate('today')">Сегодня</button>
        <button class="btn" style="flex: 1; padding: 12px; border-radius: 10px; border: none; background: #1a1f2e; color: white; font-weight: 600;" id="btn-tomorrow" onclick="setDate('tomorrow')">Завтра</button>
    </div>

    <div class="section-title">Личные данные</div>
    <div class="card">
        <input type="text" id="fullName" class="input-field" placeholder="Имя и Фамилия">
        <div class="row">
            <input type="text" id="birthDate" class="input-field" placeholder="ДД/ММ/ГГГГ" maxlength="10">
            <input type="text" id="birthTime" class="input-field" placeholder="ЧЧ:ММ" maxlength="5">
        </div>
    </div>

    <div class="section-title">География</div>
    <div class="card">
        <input type="text" id="birthCity" class="input-field" placeholder="Город рождения">
        <input type="text" id="currentCity" class="input-field" placeholder="Где вы сейчас (город)">
    </div>

    <button class="main-btn" onclick="calculateInApp()">ПОКАЗАТЬ ОТЧЕТ</button>

    <div id="resultBox" class="result-box">
        <h2>🪐 Твой Космический Отчет:</h2>
        <div class="result-item" id="resName"></div>
        <div class="result-item" id="resBirthCity"></div>
        <div class="result-item" id="resChzhp"></div>
        <div class="result-item" id="resGlobal"></div>
        <hr style="border: 0; border-top: 1px solid rgba(242,201,76,0.2); margin: 15px 0;">
        <div class="result-item" style="font-size: 16px;" id="resPersonal"></div>
        <div class="result-item" style="color: #ccc; font-style: italic;" id="resInterpretation"></div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedDate = 'today';
        setDate('today');

        function setDate(date) {
            selectedDate = date;
            document.getElementById('btn-today').style.background = date === 'today' ? '#f2c94c' : '#1a1f2e';
            document.getElementById('btn-today').style.color = date === 'today' ? '#0a0e17' : 'white';
            document.getElementById('btn-tomorrow').style.background = date === 'tomorrow' ? '#f2c94c' : '#1a1f2e';
            document.getElementById('btn-tomorrow').style.color = date === 'tomorrow' ? '#0a0e17' : 'white';
        }

        // Умная маска даты: принимает точки, слэши или просто цифры
        document.getElementById('birthDate').addEventListener('input', function (e) {
            let val = e.target.value.replace(/[^0-9./]/g, '');
            let digits = val.replace(/\D/g, '');
            if (digits.length > 2) digits = digits.slice(0, 2) + '/' + digits.slice(2);
            if (digits.length > 5) digits = digits.slice(0, 5) + '/' + digits.slice(5, 9);
            e.target.value = digits || val;
        });

        // Умная маска времени
        document.getElementById('birthTime').addEventListener('input', function (e) {
            let val = e.target.value.replace(/[^0-9:]/g, '');
            let digits = val.replace(/\D/g, '');
            if (digits.length > 2) digits = digits.slice(0, 2) + ':' + digits.slice(2, 4);
            e.target.value = digits || val;
        });

        const INTERPRETATIONS = {
            1: "День активных действий, лидерства и личного прорыва. Начинай новые проекты!",
            2: "День дипломатии, компромиссов и работы в паре. Действуй мягко, прислушивайся к другим.",
            3: "🔥 Твой день творчества, самовыражения, общения и легкого решения проблем! Идеально для генерации идей.",
            4: "День структуры, упорного труда и наведения порядка в делах, коде или планах.",
            5: "День свободы, путешествий, перемен и неожиданных возможностей. Будь гибким!",
            6: "День семьи, уюта, заботы о близких и гармонизации пространства вокруг себя.",
            7: "День глубоких размышлений, учебы, кодинга, медитации и уединения.",
            8: "День больших масштабов, финансов, бизнеса и подведения крупных результатов.",
            9: "День завершения старых циклов, отдачи долгов и очищения пространства от хлама."
        };

        function digRoot(n) { return (n - 1) % 9 + 1; }

        function calculateInApp() {
            let fullName = document.getElementById('fullName').value.trim();
            let birthStr = document.getElementById('birthDate').value.trim();
            let birthCity = document.getElementById('birthCity').value.trim() || "Не указан";
            let currentCity = document.getElementById('currentCity').value.trim();

            if(!fullName || birthStr.length < 10 || !currentCity) {
                alert("Заполните Имя, Дату рождения и Текущий город!");
                return;
            }

            // Чистим разделители и приводим к массиву
            let cleanBirth = birthStr.replace(/\./g, '/');
            let parts = cleanBirth.split('/');
            let day = parseInt(parts[0]);
            let month = parseInt(parts[1]);
            let year = parseInt(parts[2]);

            // 1. Считаем ЧЖП
            let chzhp = digRoot(day + month + year);

            // 2. Определяем целевую дату (сегодня/завтра)
            let target = new Date();
            if(selectedDate === 'tomorrow') {
                target.setDate(target.getDate() + 1);
            }

            // 3. Общее число дня (Мировое)
            let tDay = target.getDate();
            let tMonth = target.getMonth() + 1; 
            let tYear = target.getFullYear();
            
            let dateStr = "" + tDay + tMonth + tYear;
            let globalSum = 0;
            for(let i=0; i<dateStr.length; i++) { globalSum += parseInt(dateStr[i]); }
            let globalNum = digRoot(globalSum);

            // 4. Твое Личное Число Дня
            let personalNum = digRoot(chzhp + tDay + tMonth);

            // Отображаем данные на экране пульта
            document.getElementById('resName').innerHTML = `👤 Профиль: <b>${fullName}</b>`;
            document.getElementById('resBirthCity').innerHTML = `📍 Родина: <b>${birthCity}</b>`;
            document.getElementById('resChzhp').innerHTML = `• Код рождения (ЧЖП): <span class="number-badge">${chzhp}</span>`;
            document.getElementById('resGlobal').innerHTML = `• Число мира на этот день: <span class="number-badge">${globalNum}</span>`;
            document.getElementById('resPersonal').innerHTML = `🎯 ТВОЕ ЛИЧНОЕ ЧИСЛО ДНЯ: <span class="number-badge">${personalNum}</span>`;
            document.getElementById('resInterpretation').innerHTML = `👉 ${INTERPRETATIONS[personalNum] || ''}`;

            // Показываем скрытый блок
            document.getElementById('resultBox').style.style = 'block';
            document.getElementById('resultBox').style.display = 'block';
            
            // Плавный скролл вниз
            document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
