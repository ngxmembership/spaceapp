<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e17;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { font-size: 24px; margin: 0; color: #f2c94c; }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(242, 201, 76, 0.2);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .toggle-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            width: 100%;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #f2c94c; }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-group { display: flex; gap: 10px; width: 100%; margin-bottom: 20px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            background: #1a1f2e; color: white; cursor: pointer; font-weight: 600;
        }
        .btn.active { background: #f2c94c; color: #0a0e17; }
        
        .main-btn {
            background: #f2c94c; color: #0a0e17; padding: 15px; border-radius: 12px;
            width: 100%; border: none; font-size: 18px; font-weight: bold; margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Space Panel 2.0</h1>
        <p style="color: #888;">Настрой свой прогноз</p>
    </div>

    <div class="btn-group">
        <button class="btn active" onclick="setDate('today')">Сегодня</button>
        <button class="btn" onclick="setDate('tomorrow')">Завтра</button>
    </div>

    <div class="toggle-container">
        <span>Показывать биологические часы</span>
        <label class="switch">
            <input type="checkbox" id="circadianToggle" checked>
            <span class="slider"></span>
        </label>
    </div>

    <button class="main-btn" onclick="sendToBot()">СГЕНЕРИРОВАТЬ ОТЧЕТ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedDate = 'today';

        function setDate(date) {
            selectedDate = date;
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function sendToBot() {
            let data = {
                date: selectedDate,
                show_circadian: document.getElementById('circadianToggle').checked
            };
            tg.sendData(JSON.stringify(data));
            tg.close(); // Закрываем мини-приложение после отправки
        }
    </script>
</body>
</html>
