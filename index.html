<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e17; color: white; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin: 0; color: #f2c94c; }
        .section-title {
            width: 100%; color: #f2c94c; font-size: 12px; font-weight: bold; 
            letter-spacing: 1px; margin: 15px 0 8px 5px; text-transform: uppercase;
        }
        .card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(242, 201, 76, 0.15);
            border-radius: 14px; padding: 15px; width: 100%; margin-bottom: 10px; box-sizing: border-box;
        }
        .input-field {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 12px; color: white; font-size: 16px; margin-bottom: 12px;
            box-sizing: border-box; outline: none;
        }
        .input-field:focus { border-color: #f2c94c; }
        .row { display: flex; gap: 10px; width: 100%; }
        .row .input-field { flex: 1; }
        .toggle-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #f2c94c; }
        input:checked + .slider:before { transform: translateX(24px); }
        .btn-group { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            background: #1a1f2e; color: white; cursor: pointer; font-weight: 600; font-size: 15px;
        }
        .btn.active { background: #f2c94c; color: #0a0e17; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Space Panel 2.0</h1>
        <p style="color: #888; margin: 5px 0 0 0; font-size: 14px;">Параметры расчета без лишних точек</p>
    </div>

    <div class="section-title">Выбор периода</div>
    <div class="btn-group">
        <button class="btn active" id="btn-today" onclick="setDate('today')">Сегодня</button>
        <button class="btn" id="btn-tomorrow" onclick="setDate('tomorrow')">Завтра</button>
    </div>

    <div class="section-title">Личные данные</div>
    <div class="card">
        <input type="text" id="fullName" class="input-field" placeholder="Имя и Фамилия">
        <div class="row">
            <input type="text" id="birthDate" class="input-field" placeholder="Только цифры: 14072003" maxlength="8">
            <input type="text" id="birthTime" class="input-field" placeholder="Только цифры: 1930" maxlength="4">
        </div>
    </div>

    <div class="section-title">География</div>
    <div class="card">
        <input type="text" id="birthCity" class="input-field" placeholder="Город рождения (например: Пермь)">
        <input type="text" id="currentCity" class="input-field" placeholder="Где вы сейчас (например: Санкт-Петербург)">
    </div>

    <div class="section-title">Дополнения</div>
    <div class="card">
        <div class="toggle-container">
            <span style="font-size: 15px;">Включить биологические часы</span>
            <label class="switch">
                <input type="checkbox" id="circadianToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        tg.MainButton.text = "СГЕНЕРИРОВАТЬ ОТЧЕТ";
        tg.MainButton.textColor = "#0a0e17";
        tg.MainButton.color = "#f2c94c";
        tg.MainButton.show();

        let selectedDate = 'today';

        function setDate(date) {
            selectedDate = date;
            document.getElementById('btn-today').classList.toggle('active', date === 'today');
            document.getElementById('btn-tomorrow').classList.toggle('active', date === 'tomorrow');
        }

        tg.onEvent('mainButtonClicked', function() {
            let fullName = document.getElementById('fullName').value.trim();
            let rawDate = document.getElementById('birthDate').value.replace(/\D/g, '');
            let rawTime = document.getElementById('birthTime').value.replace(/\D/g, '');
            let birthCity = document.getElementById('birthCity').value.trim() || "Не указан";
            let currentCity = document.getElementById('currentCity').value.trim();
            let showCircadian = document.getElementById('circadianToggle').checked ? "1" : "0";

            if(!fullName || rawDate.length !== 8 || !currentCity) {
                alert("Заполните Имя, Дату (8 цифр) и Текущий город!");
                return;
            }

            // Магия: Автоматом превращаем "14072003" в "14.07.2003"
            let birthDate = `${rawDate.substring(0,2)}.${rawDate.substring(2,4)}.${rawDate.substring(4,8)}`;
            
            // Превращаем "1930" в "19:30"
            let birthTime = "00:00";
            if(rawTime.length === 4) {
                birthTime = `${rawTime.substring(0,2)}:${rawTime.substring(2,4)}`;
            }

            let data = {
                date: selectedDate,
                full_name: fullName,
                birth_date: birthDate,
                birth_time: birthTime,
                birth_city: birthCity,
                current_city: currentCity,
                show_circadian: showCircadian === "1"
            };

            tg.sendData(JSON.stringify(data));
        });
    </script>
</body>
</html>
