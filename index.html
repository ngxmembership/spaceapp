<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #0a0e17; color: white; margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center; box-sizing: border-box;
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; margin: 0; color: #f2c94c; }
        .section-title {
            width: 100%; color: #f2c94c; font-size: 12px; font-weight: bold; 
            letter-spacing: 1px; margin: 15px 0 8px 5px; text-transform: uppercase;
        }
        .card {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(242, 201, 76, 0.15);
            border-radius: 14px; padding: 15px; width: 100%; margin-bottom: 10px; box-sizing: border-box;
        }
        .input-field {
            width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px; padding: 12px; color: white; font-size: 16px; margin-bottom: 12px;
            box-sizing: border-box; outline: none;
        }
        .input-field:focus { border-color: #f2c94c; }
        .row { display: flex; gap: 10px; width: 100%; }
        .row .input-field { flex: 1; }
        .toggle-container { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #f2c94c; }
        input:checked + .slider:before { transform: translateX(24px); }
        .btn-group { display: flex; gap: 10px; width: 100%; margin-bottom: 10px; }
        .btn {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            background: #1a1f2e; color: white; cursor: pointer; font-weight: 600; font-size: 15px;
        }
        .btn.active { background: #f2c94c; color: #0a0e17; }
        .main-btn {
            background: #f2c94c; color: #0a0e17; padding: 16px; border-radius: 12px;
            width: 100%; border: none; font-size: 16px; font-weight: bold; margin-top: 15px;
            cursor: pointer; box-shadow: 0 4px 15px rgba(242, 201, 76, 0.2);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Space Panel 2.0</h1>
        <p style="color: #888; margin: 5px 0 0 0; font-size: 14px;">Настрой параметры расчета</p>
    </div>

    <div class="section-title">Выбор периода</div>
    <div class="btn-group">
        <button class="btn active" id="btn-today" onclick="setDate('today')">Сегодня</button>
        <button class="btn" id="btn-tomorrow" onclick="setDate('tomorrow')">Завтра</button>
    </div>

    <div class="section-title">Личные данные</div>
    <div class="card">
        <input type="text" id="fullName" class="input-field" placeholder="Имя и Фамилия">
        <div class="row">
            <input type="text" id="birthDate" class="input-field" placeholder="ДД/ММ/ГГГГ" maxlength="10">
            <input type="text" id="birthTime" class="input-field" placeholder="ЧЧ:ММ" maxlength="5">
        </div>
    </div>

    <div class="section-title">География</div>
    <div class="card">
        <input type="text" id="birthCity" class="input-field" placeholder="Город рождения">
        <input type="text" id="currentCity" class="input-field" placeholder="Где вы сейчас">
    </div>

    <div class="section-title">Дополнения</div>
    <div class="card">
        <div class="toggle-container">
            <span style="font-size: 15px;">Включить биологические часы</span>
            <label class="switch">
                <input type="checkbox" id="circadianToggle" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <button class="main-btn" onclick="sendToBot()">СКОПИРОВАТЬ ДАННЫЕ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedDate = 'today';

        function setDate(date) {
            selectedDate = date;
            document.getElementById('btn-today').classList.toggle('active', date === 'today');
            document.getElementById('btn-tomorrow').classList.toggle('active', date === 'tomorrow');
        }

        // Автоподстановка косых черт для даты
        document.getElementById('birthDate').addEventListener('input', function (e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(0, 2) + '/' + val.slice(2);
            if (val.length > 5) val = val.slice(0, 5) + '/' + val.slice(5, 9);
            e.target.value = val;
        });

        // Автоподстановка двоеточия для времени
        document.getElementById('birthTime').addEventListener('input', function (e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) val = val.slice(0, 2) + ':' + val.slice(2, 4);
            e.target.value = val;
        });

        function sendToBot() {
            let fullName = document.getElementById('fullName').value.trim();
            let birthDate = document.getElementById('birthDate').value.trim();
            let birthTime = document.getElementById('birthTime').value.trim() || "00:00";
            let birthCity = document.getElementById('birthCity').value.trim() || "Не указан";
            let currentCity = document.getElementById('currentCity').value.trim();
            let showCircadian = document.getElementById('circadianToggle').checked ? "1" : "0";

            if(!fullName || birthDate.length < 10 || !currentCity) {
                alert("Пожалуйста, заполните Имя, Дату рождения и Текущий город!");
                return;
            }

            let textCommand = `/run_calc ${selectedDate}||${fullName}||${birthDate}||${birthTime}||${birthCity}||${currentCity}||${showCircadian}`;

            // Копируем сгенерированную команду в буфер обмена телефона/компа
            let dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = textCommand;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            // Показываем четкое уведомление
            alert("✅ Данные скопированы! Закрой панель, вставь текст в чат бота и отправь.");
            tg.close();
        }
    </script>
</body>
</html>
